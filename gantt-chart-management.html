<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gantt Chart Management</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #ganttChart { width: 100%; height: 400px; position: relative; }
        .task { position: absolute; height: 30px; background-color: red; color: white; text-align: center; }
        .milestone { background-color: blue; }
        #statistics { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Gantt Chart Management</h1>
    <div id="ganttChart"></div>
    <div id="controls">
        <button onclick="exportData()">Export</button>
        <button onclick="importData()">Import</button>
    </div>
    <div id="statistics"></div>

    <script>
        const tasks = [];

        function addTask(name, start, duration) {
            tasks.push({ name, start, duration });
            drawGanttChart();
            saveToLocalStorage();
        }

        function drawGanttChart() {
            const ganttChart = document.getElementById('ganttChart');
            ganttChart.innerHTML = '';
            tasks.forEach((task, index) => {
                const taskDiv = document.createElement('div');
                taskDiv.className = 'task';
                taskDiv.style.left = `${task.start}px`;
                taskDiv.style.width = `${task.duration}px`;
                taskDiv.innerText = task.name;
                ganttChart.appendChild(taskDiv);
            });
        }

        function saveToLocalStorage() {
            localStorage.setItem('ganttTasks', JSON.stringify(tasks));
        }

        function loadFromLocalStorage() {
            const savedTasks = JSON.parse(localStorage.getItem('ganttTasks')) || [];
            savedTasks.forEach(task => addTask(task.name, task.start, task.duration));
        }

        function exportData() {
            const dataStr = JSON.stringify(tasks);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tasks.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData() {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.json';
            fileInput.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = e => {
                    const importedTasks = JSON.parse(e.target.result);
                    importedTasks.forEach(task => addTask(task.name, task.start, task.duration));
                };
                reader.readAsText(file);
            };
            fileInput.click();
        }

        loadFromLocalStorage();
    </script>
</body>
</html>
