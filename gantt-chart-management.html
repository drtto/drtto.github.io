<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gantt Chart Management</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .gantt {
            position: relative;
        }
        .timeline {
            display: flex;
            flex-direction: row;
            position: relative;
            background-color: red;
            height: 50px;
        }
        .project, .milestone {
            background-color: #f1f1f1;
            margin: 5px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        @media (max-width: 600px) {
            .gantt {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>Gantt Chart Management</h1>
    <div>
        <input type="text" id="filter" placeholder="Filter...">
        <button id="export-btn">Export</button>
        <button id="import-btn">Import</button>
    </div>
</header>
<div class="gantt">
    <div class="timeline">
        <!-- Red timeline representation -->
    </div>
    <div id="projects">
        <!-- Dynamic project display -->
    </div>
</div>
<script>
    // JavaScript for dynamic functions, localStorage, filtering, exporting and importing
    document.getElementById('export-btn').addEventListener('click', function() {
        // Logic for exporting data
        alert('Export functionality to be implemented.');
    });
    document.getElementById('import-btn').addEventListener('click', function() {
        // Logic for importing data
        alert('Import functionality to be implemented.');
    });
    // Other dynamic functionalities for managing projects, scientists, milestones, etc.
</script>
</body>
</html>
