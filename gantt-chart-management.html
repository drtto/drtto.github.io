<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gantt Chart Management Tool</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .gantt-chart { display: flex; }
        .bar { height: 20px; margin: 2px; border-radius: 5px; }
        @media (max-width: 600px) {
            .gantt-chart { flex-direction: column; }
            .bar { width: 100%; }
        }
    </style>
</head>
<body>
    <h1>Gantt Chart Management Tool</h1>
    <div id="project-manager">
        <input type="text" id="project-name" placeholder="Project Name" />
        <button id="add-project">Add Project</button>
    </div>
    <div id="gantt"> </div>

    <script>
        let projects = [];

        function renderProjects() {
            const ganttDiv = document.getElementById('gantt');
            ganttDiv.innerHTML = '';
            projects.forEach(project => {
                const color = '#' + Math.floor(Math.random()*16777215).toString(16);
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.backgroundColor = color;
                bar.style.width = project.duration + 'px'; // duration in pixels
                ganttDiv.appendChild(bar);
            });
        }

        function addProject() {
            const projectName = document.getElementById('project-name').value;
            const duration = Math.floor(Math.random() * 300); // Example random duration
            projects.push({ name: projectName, duration });
            localStorage.setItem('projects', JSON.stringify(projects));
            renderProjects();
        }

        document.getElementById('add-project').addEventListener('click', addProject);

        function loadProjects() {
            const savedProjects = localStorage.getItem('projects');
            if (savedProjects) {
                projects = JSON.parse(savedProjects);
                renderProjects();
            }
        }

        loadProjects();
    </script>
</body>
</html>
