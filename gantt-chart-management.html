<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gantt Chart Management</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .timeline { position: relative; height: 50px; border-top: 2px solid red; }
        .project-bar { position: absolute; height: 30px; color: white; text-align: center; }
        select { margin: 10px; }
        .scrollable { overflow-x: auto; white-space: nowrap; }
    </style>
</head>
<body>
    <h1>Project Gantt Chart</h1>
    <label for="scientistFilter">Filter by Scientist:</label>
    <select id="scientistFilter">
        <option value="all">All Scientists</option>
        <option value="scientist1">Scientist 1</option>
        <option value="scientist2">Scientist 2</option>
        <option value="scientist3">Scientist 3</option>
    </select>
    <div class="scrollable">
        <div class="timeline" id="timeline"></div>
        <div id="projects"></div>
    </div>
    <script>
        const projects = [];

        const addProject = (name, duration, color) => {
            const project = { name, duration, color };
            projects.push(project);
            renderProjects();
            saveToLocalStorage();
        };

        const renderProjects = () => {
            const projectsDiv = document.getElementById('projects');
            projectsDiv.innerHTML = '';
            projects.forEach((project, index) => {
                const bar = document.createElement('div');
                bar.className = 'project-bar';
                bar.style.backgroundColor = project.color;
                bar.style.width = project.duration + '%';
                bar.style.left = (index * 10) + '%';  // Example positioning
                bar.innerText = project.name;
                projectsDiv.appendChild(bar);
            });
        };

        const saveToLocalStorage = () => {
            localStorage.setItem('projects', JSON.stringify(projects));
        };

        const loadFromLocalStorage = () => {
            const storedProjects = localStorage.getItem('projects');
            if (storedProjects) {
                JSON.parse(storedProjects).forEach(project => addProject(project.name, project.duration, project.color));
            }
        };

        document.getElementById('scientistFilter').addEventListener('change', (event) => {
            // Implement filtering logic here
        });

        loadFromLocalStorage();
        // Example of adding project with random color
        addProject('Project A', 30, 'rgb(' + Math.floor(Math.random() * 256) + ',' + Math.floor(Math.random() * 256) + ',' + Math.floor(Math.random() * 256) + ')');
    </script>
</body>
</html>
