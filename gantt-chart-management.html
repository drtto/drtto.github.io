<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Gantt Chart Management Tool</title>\n    <style>\n        /* Add your styles for responsiveness, timeline, symbols */\n    </style>\n</head>\n<body>\n\n    <h1>Gantt Chart Management Tool</h1>\n    <div id="project-form">\n        <input type="text" id="scientist-name" placeholder="Scientist Name" required>\n        <input type="date" id="start-date" required>\n        <input type="date" id="end-date" required>\n        <input type="date" id="milestone-deadline" required>\n        <input type="date" id="report-deadline" required>\n        <button id="add-project">Add Project</button>\n    </div>\n\n    <div id="project-list"></div>\n    <button id="export-projects">Export Projects</button>\n    <button id="import-projects">Import Projects</button>\n    <div id="statistics"></div>\n\n    <script>\n        class Project {\n            constructor(scientistName, startDate, endDate, milestoneDeadline, reportDeadline) {\n                this.scientistName = scientistName;\n                this.startDate = startDate;\n                this.endDate = endDate;\n                this.milestoneDeadline = milestoneDeadline;\n                this.reportDeadline = reportDeadline;\n            }\n        }\n\n        const projects = [];\n\n        document.getElementById('add-project').addEventListener('click', function() {\n            const scientistName = document.getElementById('scientist-name').value;\n            const startDate = document.getElementById('start-date').value;\n            const endDate = document.getElementById('end-date').value;\n            const milestoneDeadline = document.getElementById('milestone-deadline').value;\n            const reportDeadline = document.getElementById('report-deadline').value;\n\n            const project = new Project(scientistName, startDate, endDate, milestoneDeadline, reportDeadline);\n            projects.push(project);\n            localStorage.setItem('projects', JSON.stringify(projects));\n            renderProjects();\n        });\n\n        function renderProjects() {\n            const projectListDiv = document.getElementById('project-list');\n            projectListDiv.innerHTML = '';\n            projects.forEach((project, index) => {\n                projectListDiv.innerHTML += `<div>${project.scientistName} - ${project.startDate} to ${project.endDate}</div>\n                                             <button onclick=\"deleteProject(${index})\">Delete</button>`;\n            });\n        }\n\n        function deleteProject(index) {\n            projects.splice(index, 1);\n            localStorage.setItem('projects', JSON.stringify(projects));\n            renderProjects();\n        }\n\n        window.onload = function() {\n            const storedProjects = JSON.parse(localStorage.getItem('projects'));\n            if (storedProjects) {\n                projects.push(...storedProjects);\n                renderProjects();\n            }\n        }\n    <\/script>\n</body>\n</html>\n
